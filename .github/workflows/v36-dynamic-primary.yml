name: V3.6 Single Primary Routing QA
on:
  push:
    branches: [feature/v3-6-single-primary-dynamic-join]
  pull_request:
    paths:
      - 'conversion-worker/**'
      - 'link-management.js'
      - 'analytics-dashboard.html'
      - 'ops-health-v34.js'
      - 'tests/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker and previous releases
        run: |
          node --check conversion-worker/src/index.mjs
          node --check conversion-worker/src/link-management.mjs
          node --check link-management.js
          node --check ops-health-v34.js
          node --test conversion-worker/test/conversion.test.mjs
          node --test conversion-worker/test/ip-dedup.test.mjs
          node --test conversion-worker/test/admin-session.test.mjs
          node --test tests/admin-dashboard-v323.test.cjs
          node --test tests/v34-release.test.cjs
          node --test tests/v35-auth.test.cjs
      - name: New single-primary routing contract
        run: |
          node --test conversion-worker/test/dynamic-primary.test.mjs
          node build-ga4.cjs
          node --test tests/v36-dynamic-site.test.cjs
