name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate analytics JavaScript and inject across HTML pages
        run: |
          node --check ga4-config.js
          node --check ga4-analytics.js
          node --check build-ga4.cjs
          node --check lead-form.js
          node --check conversion-config.js
          node --check conversion-tracker.js
          node --check link-entry-v34.js
          node --check ops-health-v34.js
          node --check link-management.js
          node --check conversion-worker/src/link-management.mjs
          node --check analytics-dashboard.js
          node --check analytics-dashboard-v323.js
          node --check conversion-worker/src/reports.mjs
          node --check conversion-worker/src/index.mjs
          node --test conversion-worker/test/conversion.test.mjs
          node --test tests/admin-dashboard-v323.test.cjs
          node build-ga4.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
