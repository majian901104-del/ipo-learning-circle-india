name = "angel-research-conversion-v31"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
COMMUNITY_DESTINATION = "https://cc.stockscode.click"
LINK_MODE_ENABLED = "false"  # Enable only after worker + static-site coordinated release
LINK_IP_DEDUP_ENABLED = "false" # Deprecated: never blocks repeat network visitors anymore
ANALYTICS_IP_DEDUP_ENABLED = "false" # Set true after ANALYTICS_IP_HASH_KEY and D1 schema
ANALYTICS_IP_DEDUP_HOURS = "24" # First page view and first WhatsApp click per IP per rolling 24h

# V3.1 redeploy after enabling Cloudflare Analytics Engine in the dashboard.
# The dataset name and Worker binding match the newly enabled account.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "angel_research_conversion_v31"

# V3.2: Cloudflare Analytics SQL query binding (no API token needed).
# Requires Wrangler >= 4.145; REPORT_ACCESS_KEY is configured as a Worker secret.
[analytics]
binding = "ANALYTICS_SQL"

# V3.3 Cloudflare D1 linkage; database ID from Cloudflare console.
[[d1_databases]]
binding = "LINK_DB"
database_name = "angel-research-links-v33"
database_id = "18cb4b62-6b89-481a-bc24-6601f24d2e49"

# Daily deletion of expired IP pseudonyms and old one-use link grants.
[triggers]
crons = ["0 3 * * *"]
