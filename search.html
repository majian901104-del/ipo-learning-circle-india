ce.html","Corporate governance and statutory disclosures"],["Regulatory Information","regulatory.html","SEBI registrations and disclosures"],["Leadership","leadership.html","Investment leadership profiles"],["History & Milestones","history.html","Company history and milestones"],["Contact & Office","contact.html","Mumbai registered office and IPO desk"]];function go(){const q=document.getElementById("q").value.toLowerCase().trim();const box=document.getElementById("results");const hits=pages.filter(x=>!q||x.join(" ").toLowerCase().includes(q));box.innerHTML=hits.map(x=>'<a href="'+x[1]+'"><b>'+x[0]+'</b><span>'+x[2]+'</span></a>').join("")||"<p>No matching pages found.</p>"}document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")go()});go();</script></body></html>
